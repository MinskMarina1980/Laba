name: Build & Deploy

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: sudo docker build -t laba /home/user/Laba/python

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Deploy container
        run: sudo docker run -d -p 8080:80 --name laba laba
